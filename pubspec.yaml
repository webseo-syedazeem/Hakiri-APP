name: hakkiri_app
description: "Hakkiri - Daily Communication Gym for Real-Life Professional Agility"
publish_to: 'none'

version: 1.0.9+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  video_player: ^2.9.2
  http: ^1.6.0
  shared_preferences: ^2.5.6
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6
  record: ^6.2.1
  path_provider: ^2.1.6
  speech_to_text: ">=7.4.0 <7.5.0"
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.1.0
  firebase_crashlytics: ^5.0.0
  audioplayers: ^6.5.1
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.3
  url_launcher: ^6.3.1
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# path_provider_foundation 2.6.0 uses FFI/objective_c that fails to load on
# iOS (simulator + some device builds) → getTemporaryDirectory throws →
# Think Fast saves no audio → feedback shows "no response". 2.5.1 uses
# method channels and is stable. See flutter/flutter#186794.
dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/video/
